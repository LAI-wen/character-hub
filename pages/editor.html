<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>編輯：宵霧 · CharacterHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+TC:wght@600;700;900&family=Shippori+Mincho+B1:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">
<style>
  html,body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .topbar { flex: none; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar .inner { padding: 10px var(--s6); display: flex; align-items: center; gap: var(--s4); }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: -.02em; }
  .brand .mk { width: 22px; height: 22px; border-radius: 7px; background: var(--text); color: #fff; display: grid; place-items: center; font-family: var(--font-serif); font-size: 14px; }
  .topbar .div { width: 1px; height: 22px; background: var(--border); }
  .editing { font-size: 14px; } .editing b { font-weight: 600; } .editing .sv { color: var(--text-faint); font-size: 12px; margin-left: 8px; }
  .topbar .spacer { flex: 1; }
  .privsel { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--r-btn); background: var(--surface); color: var(--text-dim); cursor: pointer; }
  .privsel:hover { background: var(--bg-tint); }

  .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .editpane { overflow-y: auto; border-right: 1px solid var(--border); background: var(--bg); }
  .editpane .pad { padding: var(--s6); max-width: 640px; }
  .previewpane { background: var(--bg-tint); overflow-y: auto; position: relative; }

  /* accordion */
  .acc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: var(--s3); overflow: hidden; }
  .acc-h { display: flex; align-items: center; gap: 10px; padding: 14px var(--s4); cursor: pointer; user-select: none; }
  .acc-h .n { width: 26px; height: 26px; border-radius: 7px; background: var(--bg-tint); display: grid; place-items: center; color: var(--text-dim); }
  .acc-h h3 { font-size: 14.5px; font-weight: 600; margin: 0; } .acc-h .en { font-size: 11px; color: var(--text-faint); }
  .acc-h .badge { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); background: var(--bg-tint); padding: 2px 7px; border-radius: var(--r-pill); margin-left: 4px; }
  .acc-h .chev { margin-left: auto; color: var(--text-faint); transition: transform .2s; display: grid; place-items: center; }
  .acc.closed .chev { transform: rotate(-90deg); }
  .acc.closed .acc-b { display: none; }
  .acc-b { padding: var(--s4); border-top: 1px solid var(--border); }

  /* form controls */
  .lbl { font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; display: block; }
  .hint { font-size: 11.5px; color: var(--text-faint); margin: 6px 0 0; line-height: 1.5; }
  .inp { width: 100%; font-family: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: var(--r-btn); background: var(--surface); color: var(--text); }
  .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .inp.mono { font-family: var(--font-mono); }
  textarea.inp { resize: vertical; line-height: 1.6; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
  .field-block { margin-bottom: 14px; }
  .grip { color: var(--text-faint); cursor: grab; font-size: 14px; display: grid; place-items: center; }
  .addbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); padding: 9px 12px; border: 1px dashed var(--border-strong); border-radius: var(--r-btn); background: var(--surface); margin-top: 4px; cursor: pointer; }
  .addbtn:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* delete / icon buttons */
  .del { width: 28px; height: 28px; flex: none; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-faint); display: grid; place-items: center; cursor: pointer; transition: all .12s; }
  .del:hover { border-color: var(--avoid); color: var(--avoid); background: var(--avoid-soft); }
  .eyd { width: 28px; height: 28px; flex: none; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-faint); display: grid; place-items: center; cursor: pointer; transition: all .12s; }
  .eyd:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .minibtn { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 6px 9px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); color: var(--text-dim); cursor: pointer; }
  .minibtn:hover { background: var(--bg-tint); color: var(--text); }

  /* avatar + accent editor */
  .avatar-edit { display: flex; gap: 14px; align-items: center; }
  .av-slot { width: 72px; height: 72px; border-radius: 50%; flex: none; border: 2px dashed var(--border-strong); background: var(--surface-2); display: grid; place-items: center; color: var(--text-faint); font-size: 22px; cursor: pointer; overflow: hidden; transition: border-color .15s; }
  .av-slot:hover { border-color: var(--ac, var(--accent)); }
  .av-slot.filled { border-style: solid; border-color: var(--ac, var(--accent)); border-width: 3px; background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 6px, #ececec 6px, #ececec 12px); }
  .av-side { display: flex; flex-direction: column; gap: 9px; }
  .acolor { display: flex; align-items: center; gap: 8px; }
  .acolor .achip { position: relative; width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; flex: none; }
  .acolor .achip:hover { box-shadow: 0 0 0 3px var(--accent-soft); }
  .acolor .achip input[type=color] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: none; cursor: pointer; }
  .acolor .inp { width: 104px; }

  /* segmented control */
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--bg-tint); border: 1px solid var(--border); border-radius: var(--r-btn); }
  .seg button { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 6px; color: var(--text-dim); border: none; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }

  /* custom fields */
  .kv-row { display: grid; grid-template-columns: 1fr 1.2fr auto auto; gap: 8px; align-items: center; margin-bottom: 8px; }

  /* swatch editor */
  .sw-edit { display: grid; grid-template-columns: auto 1fr 130px auto auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .sw-edit .chipwrap { position: relative; width: 38px; height: 38px; flex: none; }
  .sw-edit .chip { width: 38px; height: 38px; border-radius: 8px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; display: block; }
  .sw-edit .chip:hover { box-shadow: 0 0 0 3px var(--accent-soft); }
  .sw-edit input[type=color] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: none; cursor: pointer; }

  /* gallery */
  .album { margin-bottom: var(--s4); }
  .album-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .album-head .at { font-size: 13px; font-weight: 700; } .album-head .ae { font-size: 11px; color: var(--text-faint); }
  .album-head .spacer { flex: 1; }
  .gal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .gtile { position: relative; aspect-ratio: 3/4; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); }
  .gtile .ph { position: absolute; inset: 0; border: none; border-radius: 0; }
  .gtile .gdel { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 6px; background: rgba(28,27,25,.62); color: #fff; border: none; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .12s; }
  .gtile:hover .gdel { opacity: 1; }
  .gtile.add { border: 1.5px dashed var(--border-strong); background: var(--surface-2); display: grid; place-items: center; cursor: pointer; color: var(--text-faint); }
  .gtile.add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .gtile .gstar { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 6px; background: rgba(28,27,25,.6); color: #fff; border: none; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .12s; }
  .gtile:hover .gstar { opacity: 1; } .gtile .gstar.on { opacity: 1; background: var(--accent); }
  .gtile .mainbadge { position: absolute; bottom: 4px; left: 4px; font-size: 9px; font-weight: 700; color: #fff; background: var(--accent); padding: 2px 6px; border-radius: var(--r-pill); display: none; }
  .gtile .mainbadge.on { display: block; }
  .keyvis { display: flex; gap: 14px; }
  .keyvis .kv-slot { width: 100px; aspect-ratio: 3/4; flex: none; border-radius: 10px; }
  .keyvis .kv-meta { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 9px; }
  .keyvis .kv-cur { font-size: 12px; color: var(--text-dim); } .keyvis .kv-cur b { color: var(--text); font-weight: 700; font-family: var(--font-serif); }

  /* checklist editor */
  .chk-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .chk-row .tgl { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; flex: none; }
  .chk-row .tgl button { width: 30px; height: 36px; border: none; background: var(--surface); color: var(--text-faint); cursor: pointer; display: grid; place-items: center; }
  .chk-row .tgl button.on.must { background: var(--must); color: #fff; }
  .chk-row .tgl button.on.avoid { background: var(--avoid); color: #fff; }

  /* license */
  .lic-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .lic-row:last-child { border-bottom: none; }
  .lic-row .lt { font-size: 13.5px; font-weight: 500; flex: 1; } .lic-row .lt .e { color: var(--text-faint); font-size: 11px; margin-left: 5px; }

  /* privacy */
  .priv-opt { display: flex; align-items: flex-start; gap: 11px; padding: 11px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color .12s, background .12s; }
  .priv-opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .priv-opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); flex: none; margin-top: 1px; display: grid; place-items: center; }
  .priv-opt.on .radio { border-color: var(--accent); } .priv-opt.on .radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .priv-opt .pt { font-size: 14px; font-weight: 600; } .priv-opt .pd { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .share-box { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding: 10px; background: var(--bg-tint); border-radius: 9px; }
  .share-box .lnk { flex: 1; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* marker editor */
  .marker-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .marker-canvas { position: relative; border-radius: var(--r-img); margin-bottom: var(--s3); overflow: hidden; }
  .marker-canvas.point { cursor: crosshair; } .marker-canvas.rect { cursor: crosshair; }
  .marker-canvas .ph { aspect-ratio: 4/3; border-style: solid; }
  .upload-hint { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 4; font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); background: rgba(255,255,255,.88); padding: 4px 10px; border-radius: var(--r-pill); border: 1px solid var(--border); white-space: nowrap; }
  .pin { position: absolute; width: 24px; height: 24px; border-radius: 50%; transform: translate(-50%,-50%); background: var(--text); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 2px solid #fff; box-shadow: var(--sh-2); font-family: var(--font-mono); z-index: 5; }
  .mrect { position: absolute; border: 2px solid var(--accent); background: rgba(46,111,106,.14); border-radius: 4px; z-index: 5; }
  .mrect .tag { position: absolute; top: -9px; left: -2px; width: 18px; height: 18px; border-radius: 5px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 700; font-family: var(--font-mono); }
  .mk-row { display: grid; grid-template-columns: auto auto 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
  .mk-row .n { width: 20px; height: 20px; border-radius: 50%; background: var(--text); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; font-family: var(--font-mono); }
  .mk-row .n.rect { border-radius: 5px; background: var(--accent); }
  .mk-row .kind { font-size: 10px; font-family: var(--font-mono); color: var(--text-faint); }

  /* ---- preview ---- */
  .pv-bar { position: sticky; top: 0; z-index: 5; background: rgba(244,242,237,.9); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); padding: 10px var(--s6); display: flex; align-items: center; gap: 10px; }
  .pv-bar .lb { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--text-faint); text-transform: uppercase; }
  .pv-bar .spacer { flex: 1; }
  .pv-frame { padding: var(--s6); display: flex; justify-content: center; }
  .pv-page { width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--sh-2); overflow: hidden; }
  .pv-hero { aspect-ratio: 4/5; }
  .pv-avatar-wrap { padding: 28px 0 6px; display: flex; justify-content: center; }
  .pv-avatar { width: 108px; height: 108px; border-radius: 50%; border: 1px solid var(--border); }
  .pv-body { padding: var(--s4); }
  .pv-body.center { text-align: center; }
  .pv-body h2 { font-family: var(--font-serif); font-size: 30px; margin: 0; font-weight: 700; }
  .pv-rom { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: .1em; }
  .pv-tag { font-size: 13px; color: var(--text-dim); margin: 10px 0; line-height: 1.5; }
  .pv-chips { display: flex; gap: 6px; margin: 10px 0; } .pv-body.center .pv-chips { justify-content: center; }
  .pv-chips .c { width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
  .pv-mini-h { font-size: 11px; font-weight: 700; color: var(--text-dim); margin: 14px 0 6px; display: flex; align-items: center; gap: 5px; } .pv-body.center .pv-mini-h { justify-content: center; }
  .pv-check { font-size: 12px; padding: 7px 10px; border-radius: 7px; background: var(--must-soft); border: 1px solid #CDE8D8; margin-bottom: 5px; display: flex; gap: 7px; align-items: center; text-align: left; }
  .pv-check.avoid { background: var(--avoid-soft); border-color: #F0CFCB; }

  /* commission preview card */
  .pv-cbanner { background: var(--text); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 9px; }
  .pv-cbanner .pvc-status { font-size: 11px; font-weight: 700; color: #fff; background: var(--sc); padding: 2px 9px; border-radius: var(--r-pill); white-space: nowrap; }
  .pv-cbanner .pvc-bk { font-family: var(--font-serif); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .pv-cbody { padding: 16px; }
  .pvc-title { font-family: var(--font-serif); font-size: 22px; font-weight: 800; line-height: 1.2; }
  .pvc-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; font-family: var(--font-mono); }
  .pvc-desc { font-size: 13px; color: var(--text-dim); line-height: 1.7; margin: 12px 0 0; text-wrap: pretty; }
  .pvc-desc.faint { color: var(--text-faint); font-style: italic; }
  .pvc-sec { margin-top: 16px; }
  .pvc-h { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 7px; }
  .pvc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pvc-chips span { font-size: 12px; padding: 4px 10px; border-radius: var(--r-pill); background: var(--bg-tint); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 5px; }
  .pvc-chips span i { font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .pvc-refnote { font-size: 12.5px; color: var(--text-dim); }
  .pvc-inh { display: flex; flex-wrap: wrap; gap: 6px; }
  .pvc-inh span { font-size: 11.5px; padding: 3px 9px; border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent-ink, var(--text)); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); }

  /* preview <-> edit cross-navigation */
  .pv-jump { position: relative; cursor: pointer; border-radius: 9px; transition: box-shadow .15s, background .15s; }
  .pv-jump:hover { background: var(--accent-soft); box-shadow: 0 0 0 5px var(--accent-soft); }
  .pv-jump:hover::after { content: "✎ 編輯這段"; position: absolute; top: 6px; right: 6px; z-index: 4; font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); padding: 3px 8px; border-radius: var(--r-pill); white-space: nowrap; box-shadow: var(--sh-1); }
  .pv-jump.pvflash { animation: pvflash 1.3s ease; }
  @keyframes pvflash { 0%,100% { box-shadow: 0 0 0 0 transparent; background: transparent; } 18% { box-shadow: 0 0 0 5px var(--accent-soft); background: var(--accent-soft); } }
  .acc.flash { animation: accflash 1.3s ease; }
  @keyframes accflash { 0%,100% { outline: 0 solid transparent; outline-offset: 2px; } 22% { outline: 2px solid var(--accent); outline-offset: 2px; } }

  /* edit-pane tabs (core / more) */
  .etabs { display: flex; gap: 4px; background: var(--bg-tint); border: 1px solid var(--border); border-radius: var(--r-btn); padding: 4px; margin-bottom: var(--s4); }
  .etabs button { flex: 1; padding: 9px; font-size: 13.5px; font-weight: 600; border: none; background: transparent; color: var(--text-dim); border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .etabs button.on { background: var(--surface); color: var(--text); box-shadow: var(--sh-1); }
  .etabs button .ct { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); background: var(--bg-tint); padding: 1px 6px; border-radius: var(--r-pill); }
  .etabs button.on .ct { background: var(--bg-tint); }

  .more-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); margin: 4px 0 var(--s3); }
  .more-h:not(:first-child) { margin-top: var(--s8); }
  .linkcard { display: flex; align-items: center; gap: 12px; padding: 13px var(--s4); border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); margin-bottom: var(--s3); cursor: pointer; transition: border-color .12s, box-shadow .12s, transform .12s; text-decoration: none; color: inherit; }
  .linkcard:hover { border-color: var(--border-strong); box-shadow: var(--sh-1); transform: translateY(-1px); }
  .linkcard.soon { opacity: .55; cursor: default; } .linkcard.soon:hover { transform: none; box-shadow: none; border-color: var(--border); }
  .linkcard .lc-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--bg-tint); display: grid; place-items: center; color: var(--text-dim); flex: none; }
  .linkcard .lc-t { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; } .linkcard .lc-d { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .linkcard .lc-tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em; padding: 2px 6px; border-radius: var(--r-pill); background: var(--bg-tint); color: var(--text-faint); }
  .linkcard .lc-arrow { margin-left: auto; color: var(--text-faint); }

  .mtabs { display: none; }

  /* ===== commissions ===== */
  .comm-listhead { display: flex; align-items: center; gap: 12px; margin-bottom: var(--s4); }
  .cl-title { font-family: var(--font-serif); font-size: 18px; font-weight: 700; }
  .cl-sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  .comm-listhead .btn-sm { margin-left: auto; white-space: nowrap; }
  .comm-cards { display: flex; flex-direction: column; gap: 12px; }
  .comm-empty { text-align: center; color: var(--text-faint); padding: 40px 20px; border: 1px dashed var(--border-strong); border-radius: var(--r-card); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .comm-empty p { margin: 0; font-size: 13px; line-height: 1.6; }
  .comm-card { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); padding: 14px 15px; transition: box-shadow .15s, border-color .15s; }
  .comm-card:hover { box-shadow: var(--sh-1); border-color: var(--border-strong); }
  .cc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }

function section(id, icon, title, en, bodyEl, open, count) {
  const acc = el('div','acc'+(open?'':' closed'));

  head.addEventListener('click', ()=>{ const wasClosed = acc.classList.contains('closed'); acc.classList.toggle('closed'); if (wasClosed) flashPreview(id); });
  acc.appendChild(head);
  const b = el('div','acc-b'); b.appendChild(bodyEl); acc.appendChild(b);
  acc._countEl = head.querySelector('.badge');
  return acc;
}
/* ---- cross-navigation between preview and editor ---- */
function jumpToSection(id){
  const acc = document.querySelector(`.acc[data-sec="${id}"]`);
  if (!acc) return;
  const inMore = document.getElementById('moreWrap').contains(acc);
  switchTab(inMore ? 'more' : 'char');
  acc.classList.remove('closed');
  const ep = document.querySelector('.editpane');
  const top = acc.getBoundingClientRect().top - ep.getBoundingClientRect().top + ep.scrollTop - 10;
  ep.scrollTo({ top, behavior:'smooth' });
  acc.classList.remove('flash'); void acc.offsetWidth; acc.classList.add('flash');
  setTimeout(()=>acc.classList.remove('flash'), 1300);
}
function flashPreview(id){
  document.querySelectorAll(`#pvPage [data-jump="${id}"]`).forEach(elm=>{

  });
}

function buildSwatch() {

      const row = el('div','sw-edit');

      const chip = el('span','chip'); chip.style.background=s.hex;
      const picker = el('input'); picker.type='color'; picker.value=/^#[0-9a-f]{6}$/i.test(s.hex)?s.hex:'#888888';
      cw.append(chip, picker);

      const hex = el('input','inp mono'); hex.value=s.hex; hex.oninput=()=>{ s.hex=hex.value; chip.style.background=hex.value; if(/^#[0-9a-f]{6}$/i.test(hex.value))picker.value=hex.value; renderPreview(); touch(); };
      picker.oninput=()=>{ s.hex=picker.value.toUpperCase(); chip.style.background=s.hex; hex.value=s.hex; renderPreview(); touch(); };
      const drop = el('button','eyd', svg(I.drop,15)); drop.title='吸色 Eyedropper';

        else { toast('此瀏覽器不支援吸色器，請用調色盤'); picker.click(); }
      };

function buildMarkers() {
  const wrap = el('div');
  wrap.innerHTML = `
    <div class="marker-toolbar">
      <span class="lbl" style="margin:0">標記工具</span>
      <div class="seg" id="mkMode">
        <button data-k="point" class="${S.markerMode==='point'?'on':''}">${svg(I.dot,13)} 點 Point</button>
        <button data-k="rect" class="${S.markerMode==='rect'?'on':''}">${svg(I.square,13)} 框 Rect</button>
      </div>
      <span class="spacer" style="flex:1"></span>
      <button class="minibtn" id="mkUpload">${svg(I.up,14)} 上傳圖片</button>
    </div>
    <div class="marker-canvas ${S.markerMode}" id="mkCanvas">
      <div class="ph" id="mkPh" data-label="${S.hasMarkerImg?'主立繪 · 已上傳':'尚未上傳圖片'}"></div>
      <div class="upload-hint" id="mkHint"></div>
    </div>
    <div id="mkList"></div>
    <p class="hint">點模式：點一下放一個標記點。框模式：在圖上拖曳框出區域。座標皆以百分比儲存，RWD 不跑位。</p>`;
  const canvas = wrap.querySelector('#mkCanvas');
  const list = wrap.querySelector('#mkList');
  const hint = wrap.querySelector('#mkHint');
  function setHint(){ hint.textContent = S.markerMode==='point' ? '點圖放置標記點 · click to drop a pin' : '在圖上拖曳框選區域 · drag to draw a box'; }
  setHint();
  wrap.querySelectorAll('#mkMode button').forEach(b=>b.onclick=()=>{ S.markerMode=b.dataset.k; wrap.querySelectorAll('#mkMode button').forEach(x=>x.classList.toggle('on',x===b)); canvas.className='marker-canvas '+S.markerMode; setHint(); });
  wrap.querySelector('#mkUpload').onclick=()=>{ S.hasMarkerImg=true; wrap.querySelector('#mkPh').setAttribute('data-label','主立繪 · 已上傳'); toast('✓ 已上傳圖片（示意）'); };
  function renderMarks(){
    canvas.querySelectorAll('.pin,.mrect').forEach(n=>n.remove());
    list.innerHTML='';
    S.markers.forEach((m,i)=>{
      if(m.type==='point'){ const p=el('div','pin'); p.style.left=m.x+'%'; p.style.top=m.y+'%'; p.textContent=i+1; canvas.appendChild(p); }
      else { const r=el('div','mrect'); r.style.left=m.x+'%'; r.style.top=m.y+'%'; r.style.width=m.w+'%'; r.style.height=m.h+'%'; r.innerHTML=`<span class="tag">${i+1}</span>`; canvas.appendChild(r); }
      const row=el('div','mk-row');
      const n=el('span','n'+(m.type==='rect'?' rect':'')); n.textContent=i+1;
      const kind=el('span','kind', m.type==='rect'?'框':'點');
      const inp=el('input','inp'); inp.value=m.label; inp.placeholder='標記說明（如：左眼淚痣）'; inp.oninput=()=>{ m.label=inp.value; touch(); };
      row.append(n, kind, inp, delBtn(()=>{ S.markers.splice(i,1); renderMarks(); touch(); }));
      list.appendChild(row);
    });
  }
  // point click
  canvas.addEventListener('click', e=>{
    if(S.markerMode!=='point') return; if(e.target.closest('.pin,.mrect')) return;
    const r=canvas.getBoundingClientRect();
    S.markers.push({type:'point', x:+((e.clientX-r.left)/r.width*100).toFixed(1), y:+((e.clientY-r.top)/r.height*100).toFixed(1), label:''});
    renderMarks(); list.querySelector('.mk-row:last-child .inp').focus(); touch();
  });
  // rect drag
  let drag=null, ghost=null;
  canvas.addEventListener('pointerdown', e=>{
    if(S.markerMode!=='rect') return; if(e.target.closest('.pin,.mrect')) return;
    const r=canvas.getBoundingClientRect();
    drag={r, x0:(e.clientX-r.left)/r.width*100, y0:(e.clientY-r.top)/r.height*100};
    ghost=el('div','mrect'); ghost.style.left=drag.x0+'%'; ghost.style.top=drag.y0+'%'; canvas.appendChild(ghost);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drag) return; const x=(e.clientX-drag.r.left)/drag.r.width*100, y=(e.clientY-drag.r.top)/drag.r.height*100;
    ghost.style.left=Math.min(drag.x0,x)+'%'; ghost.style.top=Math.min(drag.y0,y)+'%'; ghost.style.width=Math.abs(x-drag.x0)+'%'; ghost.style.height=Math.abs(y-drag.y0)+'%';
  });
  canvas.addEventListener('pointerup', e=>{
    if(!drag) return; const x=(e.clientX-drag.r.left)/drag.r.width*100, y=(e.clientY-drag.r.top)/drag.r.height*100;
    const w=Math.abs(x-drag.x0), h=Math.abs(y-drag.y0); ghost.remove(); ghost=null;
    if(w>3&&h>3){ S.markers.push({type:'rect', x:+Math.min(drag.x0,x).toFixed(1), y:+Math.min(drag.y0,y).toFixed(1), w:+w.toFixed(1), h:+h.toFixed(1), label:''}); renderMarks(); list.querySelector('.mk-row:last-child .inp').focus(); touch(); }
    drag=null;
  });
  renderMarks();
  return wrap;
}

  cal:'<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/>',
  brush:'<path d="M15 4l5 5-9.5 9.5-5 1 1-5L15 4Z"/><path d="M9.5 14.5 6 18"/>',
});
const COMM_STATUS = { talk:{t:'洽談中',c:'#A98B4E'}, progress:{t:'進行中',c:'#3B6FB0'}, done:{t:'已完成',c:'#3E8E5A'} };
const COMM_USAGE = { personal:'個人用途', commercial:'商業用途' };
const INHERIT_DEFS = [
  {k:'palette', t:'色票', d:'帶入角色配色'},
  {k:'checklist', t:'必畫・易錯', d:'必畫／NG 清單'},
  {k:'license', t:'授權範圍', d:'可／不可用途'},
  {k:'album', t:'人設相簿', d:'立繪／表情／服裝'},
  {k:'doc', t:'說明文件', d:'完整設定集'},
  {k:'profile', t:'基本資料', d:'身高／種族…'},
];
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function buildCommissions(){
  const wrap = el('div');
  wrap.innerHTML = `<div id="commList"></div><div id="commDetail" hidden></div>`;
  const listEl = wrap.querySelector('#commList');
  const detailEl = wrap.querySelector('#commDetail');

  function updCount(){ const e=document.getElementById('ctComm'); if(e) e.textContent=S.commissions.length; }
  function commLink(c){ return 'https://ochub.app/c/'+encodeURIComponent(S.rom||S.name)+'/'+c.id; }
  function copyLink(c){ const l=commLink(c); if(navigator.clipboard){ navigator.clipboard.writeText(l).then(()=>toast('✓ 已複製委託連結')).catch(()=>toast('連結：'+l)); } else toast('連結：'+l); }
  function previewComm(c){ window.open('character.html?mode=commission&commission='+c.id,'_blank'); }

  function renderList(){
    detailEl.hidden = true; listEl.hidden = false;
    pvComm=null; if(pvMode==='c') renderPreview();
    listEl.innerHTML = `<div class="comm-listhead">
        <div><div class="cl-title">委託單 Commissions</div><div class="cl-sub">每筆委託各自的需求、相簿與分享連結</div></div>
        <button class="btn btn-primary btn-sm" id="commAdd">${svg(I.plus,14)} 新增委託</button>
      </div>
      <div class="comm-cards" id="commCards"></div>`;
    const cards = listEl.querySelector('#commCards');
    if(!S.commissions.length) cards.innerHTML = `<div class="comm-empty">${svg(I.brush,26)}<p>還沒有委託單。<br>按「新增委託」建立第一筆，填好後可單獨複製連結給繪師。</p></div>`;
    S.commissions.forEach(c=>{
      const st = COMM_STATUS[c.status]||COMM_STATUS.talk;
      const card = el('div','comm-card');
      const meta = [COMM_USAGE[c.usage], c.spec, c.budget].filter(Boolean).join(' · ');
      card.innerHTML = `
        <div class="cc-top">
          <span class="cc-status" style="--sc:${st.c}">${st.t}</span>
          <span class="spacer"></span>
          <span class="cc-due">${c.due?svg(I.cal,12)+' '+c.due:''}</span>
        </div>
        <div class="cc-title">${esc(c.title)||'未命名委託'}</div>
        <div class="cc-artist">${c.artist?svg(I.brush,12)+' '+esc(c.artist):'<span class="faint">尚未指定繪師</span>'}</div>
        ${meta?`<div class="cc-meta">${esc(meta)}</div>`:''}
        <div class="cc-actions">
          <button class="minibtn cc-open">${svg(I.sliders,13)} 編輯內容</button>
          <button class="minibtn cc-link">${svg(I.link,13)} 複製連結</button>
          <button class="minibtn cc-prev">${svg(I.image,13)} 預覽</button>
          <span class="spacer"></span>
          <button class="del cc-del" title="刪除">${svg(I.trash,14)}</button>
        </div>`;
      card.querySelector('.cc-open').onclick = ()=>openDetail(c.id);
      card.querySelector('.cc-link').onclick = ()=>copyLink(c);
      card.querySelector('.cc-prev').onclick = ()=>previewComm(c);
      card.querySelector('.cc-del').onclick = ()=>{ if(confirm('刪除這筆委託？')){ S.commissions=S.commissions.filter(x=>x!==c); renderList(); updCount(); touch(); } };
      cards.appendChild(card);
    });
    listEl.querySelector('#commAdd').onclick = ()=>{
      const id = 'cm'+Date.now().toString().slice(-6);
      S.commissions.push({ id, title:'新的委託', artist:'', status:'talk', due:'', budget:'', usage:'personal', spec:'', refLink:'', desc:'',
        inherit:{ palette:true, checklist:true, license:true, album:true, doc:false, profile:true },
        cats:[], refs:[{label:'參考圖 1', has:false, markers:[]}] });
      updCount(); touch(); openDetail(id);
    };
  }

  function openDetail(id){
    const c = S.commissions.find(x=>x.id===id); if(!c) return;
    listEl.hidden = true; detailEl.hidden = false; detailEl.innerHTML='';
    pvComm=c; if(pvMode==='c') renderPreview();
    const back = el('button','comm-back', svg('<path d="M15 6l-6 6 6 6"/>',16)+' 所有委託');
    back.onclick = ()=>renderList();
    detailEl.appendChild(back);

    // --- brief info ---
    const info = el('div','field-block');
    info.innerHTML = `<label class="lbl">委託資訊 Brief</label>
      <div class="cform">
        <div class="cf-row"><span class="cf-k">委託標題</span><input class="inp" data-f="title" value="${esc(c.title)}"></div>
        <div class="cf-row"><span class="cf-k">繪師／對象</span><input class="inp" data-f="artist" placeholder="@繪師 或 對象名稱" value="${esc(c.artist)}"></div>
        <div class="cf-row"><span class="cf-k">狀態</span><div class="seg seg-sm" data-seg="status">${Object.entries(COMM_STATUS).map(([k,v])=>`<button data-v="${k}" class="${c.status===k?'on':''}">${v.t}</button>`).join('')}</div></div>
        <div class="cf-row"><span class="cf-k">截止日</span><input class="inp" type="date" data-f="due" value="${c.due||''}"></div>
        <div class="cf-row"><span class="cf-k">預算／報酬</span><input class="inp" data-f="budget" placeholder="NT$" value="${esc(c.budget)}"></div>
        <div class="cf-row"><span class="cf-k">用途</span><div class="seg seg-sm" data-seg="usage">${Object.entries(COMM_USAGE).map(([k,v])=>`<button data-v="${k}" class="${c.usage===k?'on':''}">${v}</button>`).join('')}</div></div>
        <div class="cf-row"><span class="cf-k">規格</span><input class="inp" data-f="spec" placeholder="尺寸／張數／格式" value="${esc(c.spec)}"></div>
        <div class="cf-row"><span class="cf-k">參考連結</span><input class="inp" data-f="refLink" placeholder="https://" value="${esc(c.refLink)}"></div>
      </div>
      <label class="lbl" style="margin-top:14px">委託說明 Description</label>
      <textarea class="inp ta" data-f="desc" rows="4" placeholder="想要的構圖、氛圍、用途說明…">${esc(c.desc)}</textarea>`;
    info.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=()=>{ c[inp.dataset.f]=inp.value; touch(); });
    info.querySelectorAll('[data-seg]').forEach(seg=>{ const f=seg.dataset.seg; seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ c[f]=b.dataset.v; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); touch(); }); });
    detailEl.appendChild(info);

    // --- inherit presets ---
    const inh = el('div','field-block');
    inh.innerHTML = `<label class="lbl">繼承人設 Inherit from character</label><p class="hint" style="margin:0 0 10px">打勾的項目會自動帶到這筆委託的公開頁，不用重填。</p><div class="inh-grid"></div>`;
    const ig = inh.querySelector('.inh-grid');
    INHERIT_DEFS.forEach(d=>{
      const row = el('button','inh-item'+(c.inherit[d.k]?' on':''));
      row.innerHTML = `<span class="inh-check">${svg(I.check,13)}</span><span class="inh-tx"><b>${d.t}</b><span>${d.d}</span></span>`;
      row.onclick = ()=>{ c.inherit[d.k]=!c.inherit[d.k]; row.classList.toggle('on',c.inherit[d.k]); touch(); };
      ig.appendChild(row);
    });
    detailEl.appendChild(inh);

    // --- custom gallery categories ---
    const cats = el('div','field-block');
    cats.innerHTML = `<label class="lbl">委託專屬相簿 Gallery</label><p class="hint" style="margin:0 0 10px">自由新增分類（場景／姿勢／道具…），每個分類可放多張示意圖。</p><div id="catWrap"></div>`;
    const catWrap = cats.querySelector('#catWrap');
    function renderCats(){
      catWrap.innerHTML='';
      c.cats.forEach((cat,ci)=>{
        const block = el('div','cat-block');
        const head = el('div','cat-head');
        const nameI = el('input','inp cat-name'); nameI.value=cat.name; nameI.placeholder='分類名稱（如：場景 Scene）'; nameI.oninput=()=>{ cat.name=nameI.value; touch(); };
        head.append(nameI, delBtn(()=>{ c.cats.splice(ci,1); renderCats(); touch(); }));
        block.appendChild(head);
        const grid = el('div','gal-grid');
        cat.items.forEach((it,ii)=>{
          const t=el('div','gtile');
          t.innerHTML=`<div class="ph" data-label="${esc(it)}"></div><button class="gdel">${svg('<path d="M5 5l14 14M19 5 5 19"/>',13)}</button>`;
          t.querySelector('.gdel').onclick=()=>{ cat.items.splice(ii,1); renderCats(); touch(); };
          grid.appendChild(t);
        });
        const add=el('div','gtile add', svg(I.plus,18));
        add.onclick=()=>{ cat.items.push((cat.name||'示意')+' '+(cat.items.length+1)); renderCats(); toast('✓ 已新增（示意）'); touch(); };
        grid.appendChild(add); block.appendChild(grid); catWrap.appendChild(block);
      });
      const addCat = el('button','addbtn', svg(I.plus,14)+' 新增分類 Add category');
      addCat.onclick=()=>{ c.cats.push({name:'',items:[]}); renderCats(); touch(); };
      catWrap.appendChild(addCat);
    }
    renderCats();
    detailEl.appendChild(cats);

    // --- multi-image marker board ---
    const refs = el('div','field-block');
    refs.innerHTML = `<label class="lbl">參考標記（多圖） Reference markers</label><p class="hint" style="margin:0 0 10px">委託人的多張參考圖，縮圖切換，每張各自標註說明。</p>
      <div class="ref-rail" id="refRail"></div>
      <div class="marker-toolbar"><div class="seg" id="refMode"><button data-k="point" class="on">${svg(I.dot,13)} 點</button><button data-k="rect">${svg(I.square,13)} 框</button></div><span class="spacer" style="flex:1"></span><button class="minibtn" id="refUpload">${svg(I.up,14)} 上傳此圖</button><button class="minibtn" id="refRename">重命名</button></div>
      <div class="marker-canvas point" id="refCanvas"><div class="ph" id="refPh"></div><div class="upload-hint" id="refHint"></div></div>
      <div id="refList"></div>`;
    let activeIdx=0, refMode='point';
    const rail=refs.querySelector('#refRail'), canvas=refs.querySelector('#refCanvas'), refList=refs.querySelector('#refList'), refPh=refs.querySelector('#refPh'), refHint=refs.querySelector('#refHint');
    const aRef=()=>c.refs[activeIdx];
    function renderRail(){
      rail.innerHTML='';
      c.refs.forEach((r,i)=>{ const th=el('button','ref-thumb'+(i===activeIdx?' on':'')); th.innerHTML=`<span class="rt-img ${r.has?'filled':''}"></span><span class="rt-lb">${esc(r.label)}</span><span class="rt-n">${r.markers.length}</span>`; th.onclick=()=>{ activeIdx=i; renderRail(); renderCanvas(); }; rail.appendChild(th); });
      const add=el('button','ref-thumb add', svg(I.plus,16)); add.onclick=()=>{ c.refs.push({label:'參考圖 '+(c.refs.length+1),has:false,markers:[]}); activeIdx=c.refs.length-1; renderRail(); renderCanvas(); touch(); }; rail.appendChild(add);
    }
    function renderCanvas(){
      const r=aRef(); canvas.className='marker-canvas '+refMode;
      refPh.setAttribute('data-label', r.has?(r.label+' · 已上傳'):'尚未上傳圖片');
      refHint.textContent = refMode==='point'?'點圖放置標記點 · click to drop a pin':'在圖上拖曳框選區域 · drag to draw a box';
      canvas.querySelectorAll('.pin,.mrect').forEach(n=>n.remove()); refList.innerHTML='';
      r.markers.forEach((m,i)=>{
        if(m.type==='point'){ const p=el('div','pin'); p.style.left=m.x+'%'; p.style.top=m.y+'%'; p.textContent=i+1; canvas.appendChild(p); }
        else { const rc=el('div','mrect'); rc.style.left=m.x+'%'; rc.style.top=m.y+'%'; rc.style.width=m.w+'%'; rc.style.height=m.h+'%'; rc.innerHTML=`<span class="tag">${i+1}</span>`; canvas.appendChild(rc); }
        const row=el('div','mk-row'); const n=el('span','n'+(m.type==='rect'?' rect':'')); n.textContent=i+1; const kind=el('span','kind', m.type==='rect'?'框':'點');
        const inp=el('input','inp'); inp.value=m.label; inp.placeholder='標記說明（如：希望的半身範圍）'; inp.oninput=()=>{ m.label=inp.value; touch(); };
        row.append(n,kind,inp, delBtn(()=>{ r.markers.splice(i,1); renderCanvas(); renderRail(); touch(); })); refList.appendChild(row);
      });
    }
    refs.querySelectorAll('#refMode button').forEach(b=>b.onclick=()=>{ refMode=b.dataset.k; refs.querySelectorAll('#refMode button').forEach(x=>x.classList.toggle('on',x===b)); renderCanvas(); });
    refs.querySelector('#refUpload').onclick=()=>{ aRef().has=true; renderCanvas(); renderRail(); toast('✓ 已上傳（示意）'); };
    refs.querySelector('#refRename').onclick=()=>{ const v=prompt('參考圖名稱', aRef().label); if(v!=null){ aRef().label=v; renderCanvas(); renderRail(); touch(); } };
    canvas.addEventListener('click', e=>{ if(refMode!=='point') return; if(e.target.closest('.pin,.mrect')) return; const r=canvas.getBoundingClientRect(); aRef().markers.push({type:'point',x:+((e.clientX-r.left)/r.width*100).toFixed(1),y:+((e.clientY-r.top)/r.height*100).toFixed(1),label:''}); renderCanvas(); renderRail(); refList.querySelector('.mk-row:last-child .inp').focus(); touch(); });
    let drag=null, ghost=null;
    canvas.addEventListener('pointerdown', e=>{ if(refMode!=='rect') return; if(e.target.closest('.pin,.mrect')) return; const r=canvas.getBoundingClientRect(); drag={r,x0:(e.clientX-r.left)/r.width*100,y0:(e.clientY-r.top)/r.height*100}; ghost=el('div','mrect'); ghost.style.left=drag.x0+'%'; ghost.style.top=drag.y0+'%'; canvas.appendChild(ghost); canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', e=>{ if(!drag) return; const x=(e.clientX-drag.r.left)/drag.r.width*100,y=(e.clientY-drag.r.top)/drag.r.height*100; ghost.style.left=Math.min(drag.x0,x)+'%'; ghost.style.top=Math.min(drag.y0,y)+'%'; ghost.style.width=Math.abs(x-drag.x0)+'%'; ghost.style.height=Math.abs(y-drag.y0)+'%'; });
    canvas.addEventListener('pointerup', e=>{ if(!drag) return; const x=(e.clientX-drag.r.left)/drag.r.width*100,y=(e.clientY-drag.r.top)/drag.r.height*100; const w=Math.abs(x-drag.x0),h=Math.abs(y-drag.y0); ghost.remove(); ghost=null; if(w>3&&h>3){ aRef().markers.push({type:'rect',x:+Math.min(drag.x0,x).toFixed(1),y:+Math.min(drag.y0,y).toFixed(1),w:+w.toFixed(1),h:+h.toFixed(1),label:''}); renderCanvas(); renderRail(); refList.querySelector('.mk-row:last-child .inp').focus(); touch(); } drag=null; });
    renderRail(); renderCanvas();
    detailEl.appendChild(refs);

    // --- share ---
    const share = el('div','field-block');
    share.innerHTML = `<label class="lbl">分享連結 Share</label>
      <div class="share-row"><input class="inp mono" id="shareInp" readonly value="${esc(commLink(c))}"><button class="minibtn" id="shareCopy">${svg(I.copy,13)} 複製</button></div>
      <p class="hint">每筆委託有獨立連結，可單獨傳給該繪師；對方看到的是這筆委託的專屬頁（含上方勾選繼承的人設，與這裡的相簿、標記）。</p>
      <button class="btn btn-sm" id="sharePrev" style="margin-top:10px">${svg(I.image,14)} 預覽此委託頁</button>`;
    share.querySelector('#shareCopy').onclick=()=>copyLink(c);
    share.querySelector('#shareInp').onclick=function(){ this.select(); };
    share.querySelector('#sharePrev').onclick=()=>previewComm(c);
    detailEl.appendChild(share);
  }

  renderList();
  return wrap;
}

/* ---------- mount ---------- */
const form=$('#editForm');
form.innerHTML = `<div class="etabs" id="etabs">
  <button class="on" data-t="char">${svg(I.person,15)} 人設 <span class="ct">5</span></button>
  <button data-t="comm">${svg(I.brush,15)} 委託 <span class="ct" id="ctComm">${S.commissions.length}</span></button>
  <button data-t="more">${svg(I.more,15)} 更多</button>
</div><div id="coreWrap"></div><div id="commWrap" hidden></div><div id="moreWrap" hidden></div>`;
const coreWrap=$('#coreWrap'), commWrap=$('#commWrap'), moreWrap=$('#moreWrap');
coreWrap.append(
  section('basic', I.person, '基本資料','Profile', buildBasic(), true),
  section('gallery', I.image, '圖片相簿','Gallery', buildGallery(), false, S.gallery.art.length+S.gallery.ref.length),
  section('swatch', I.palette, '色票','Color palette', buildSwatch(), true, S.swatches.length),
  section('markers', I.marker, '圖片標記','Image markers', buildMarkers(), true, S.markers.length),
  section('check', I.check, '必畫重點 / 易錯提醒','Checklist', buildChecklist(), false, S.checklist.length),
);
moreWrap.appendChild(buildMore());
commWrap.appendChild(buildCommissions());
function switchTab(t){
  $('#etabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  coreWrap.hidden = t!=='char'; commWrap.hidden = t!=='comm'; moreWrap.hidden = t!=='more';
  if(t==='comm'){ const cb=$('#pvToggle button[data-m="c"]'); if(cb && !cb.classList.contains('on')) cb.click(); }
}
$('#etabs').querySelectorAll('button').forEach(b=>b.onclick=()=>switchTab(b.dataset.t));
renderPreview(); syncPrivTop();
try{ localStorage.setItem('ch:display', S.display); }catch(e){}
saveSnapshot(); // publish current state so the public page reflects the editor immediately

/* ---------- misc ---------- */
// 顯示模式（完整立繪 / 頭像）——表單與預覽列兩處同步
function setDisplay(mode){
  S.display = mode;
  document.querySelectorAll('#dispSeg button, #pvDisp button').forEach(x=>x.classList.toggle('on', x.dataset.d===mode));
  try{ localStorage.setItem('ch:display', S.display); }catch(e){}
  renderPreview(); touch();
}
$('#pvDisp').querySelectorAll('button').forEach(b=>b.onclick=()=>setDisplay(b.dataset.d));
$('#pvToggle').querySelectorAll('button').forEach(b=>b.onclick=()=>{ pvMode=b.dataset.m; $('#pvToggle').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); renderPreview(); });
$('#privTop').onclick=()=>jumpToSection('privacy');
$('#saveBtn')?.addEventListener('click',()=>{ saveSnapshot(); toast('✓ 已儲存，已同步至公開頁'); });
$('#publishBtn').addEventListener('click',()=>{ saveSnapshot(); toast('✓ 已發佈分享頁'); });
[$('#previewBtn'),$('#previewBtn2')].forEach(b=>b&&b.addEventListener('click',()=>{ window.open('character.html?display='+S.display,'_blank'); }));
// mobile tabs
const mt=document.querySelectorAll('.mtabs button');
mt.forEach((b,i)=>b.addEventListener('click',()=>{ mt.forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('.editpane').style.display=i===0?'':'none'; $('.previewpane').style.display=i===1?'block':'none'; }));
</script>
</body>
